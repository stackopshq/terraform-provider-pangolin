---
name: Test

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: Verify no em/en dashes in versioned content
        run: |
          if hits=$(grep -rlP '[\x{2013}\x{2014}]' --exclude-dir=.git --exclude-dir=vendor .); then
            echo "::error::em-dash (U+2014) or en-dash (U+2013) found. Use ASCII hyphen '-' instead."
            echo "$hits"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Set up Terraform (for tfplugindocs schema export)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Verify tfplugindocs is idempotent
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name pangolin
          if ! git diff --exit-code docs/; then
            echo "::error::docs/ drifted from schema. Run 'go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name pangolin' and commit."
            exit 1
          fi

      - name: Test
        run: go test -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
